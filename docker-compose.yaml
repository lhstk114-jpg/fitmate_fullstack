services:
  mysql:
    image: mysql:8.0
    container_name: fitmate-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    ports:
      - "3308:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - fitmate-network

  redis:
    image: redis:7-alpine
    container_name: fitmate-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - fitmate-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fitmate-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - fitmate-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: ${DOCKERHUB_USERNAME}/fitmate-backend:latest
    container_name: fitmate-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: Asia/Seoul

      # MySQL 연결
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      # Redis 연결
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # RabbitMQ 연결
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}

      # Docker 내부 파일 저장 경로
      IMG_PATH_PRODUCT: file:/app/uploads/product/
      IMG_PATH_COMMUNITY: file:/app/uploads/community/
      IMG_PATH_MEMBER: file:/app/uploads/member/
      IMG_PATH_POPUP: file:/app/uploads/popup/
      IMG_PATH_EXERCISE: file:/app/uploads/exercise/
      IMG_PATH_SCHEDULE: file:/app/uploads/schedule/

    ports:
      - "8090:8090"

    volumes:
      - ./uploads:/app/uploads

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - fitmate-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: ${DOCKERHUB_USERNAME}/fitmate-frontend:latest
    container_name: fitmate-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - fitmate-network

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  fitmate-network:
    driver: bridge
