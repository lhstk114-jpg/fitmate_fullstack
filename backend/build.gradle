plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.spring'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' } // KOMORAN 의존성 라이브러리 빌드용
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	//security + jwt
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	//oauth2
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-oauth2-client
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client:3.5.13'

	//redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	//Websocket + Rabbitmq
	implementation 'org.springframework.boot:spring-boot-starter-websocket' //Websocket
	implementation 'org.springframework.boot:spring-boot-starter-amqp' //RabbitMQ
	implementation 'io.projectreactor.netty:reactor-netty'

	//한국어 형태소 분석기 KOMORAN (최신 스프링 부트 충돌 방지 설정 추가)
	implementation('com.github.shineware:komoran:3.3.9') {
		// 내부 구형 jackson 라이브러리가 최신 Spring Boot와 충돌하므로 제외 처리
		exclude group: 'com.fasterxml.jackson.core'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
